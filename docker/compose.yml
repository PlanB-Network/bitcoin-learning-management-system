x-defaults: &defaults
  restart: always
  init: true

  env_file:
    - .env

  environment: &environment
    DOCKER: true
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432

  healthcheck: &healthcheck
    interval: 15s
    timeout: 7s
    retries: 3
    start_period: 10s

  logging:
    driver: 'json-file'
    options:
      max-size: '5m'
      max-file: '10'
      tag: '{{.Name}}'

services:
  postgres:
    <<: *defaults
    image: postgres:15.2
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Binds only to localhost

  api:
    <<: *defaults
    image: ghcr.io/planb-network/blms-api:${IMAGE_TAG}
    environment:
      <<: *environment
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - 3000
    volumes:
      - ./data/cdn:$CDN_PATH
      - ./data/sync:$SYNC_PATH
      - ./key.asc:/tmp/key.asc:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.university-api-${ENV}.rule=((Host(`${DOMAIN_NETWORK}`) || Host(`${DOMAIN_ACADEMY}`) || Host(`contribute.${DOMAIN_ACADEMY}`)) && PathPrefix(`/api`))
      - traefik.http.routers.university-api-${ENV}.entrypoints=https
      - traefik.http.routers.university-api-${ENV}.tls=true
      - traefik.http.services.university-api-${ENV}.loadbalancer.server.port=3000
      - traefik.http.routers.university-api-${ENV}.service=university-api-${ENV}
    depends_on:
      - postgres

  cdn:
    <<: *defaults
    image: nginx:latest
    volumes:
      - ./cdn/nginx.conf:/etc/nginx/nginx.conf
      - ./data/cdn:/var/www/cdn
    labels:
      - traefik.enable=true
      - traefik.http.routers.university-cdn-${ENV}.rule=((Host(`${DOMAIN_NETWORK}`) || Host(`${DOMAIN_ACADEMY}`) || Host(`contribute.${DOMAIN_ACADEMY}`)) && PathPrefix(`/cdn`))
      - traefik.http.routers.university-cdn-${ENV}.entrypoints=https
      - traefik.http.routers.university-cdn-${ENV}.tls=true
      - traefik.http.routers.university-cdn-${ENV}.middlewares=university-cdn-${ENV}-stripprefix,university-cdn-${ENV}-compress
      - traefik.http.middlewares.university-cdn-${ENV}-compress.compress=true

  web:
    <<: *defaults
    image: ghcr.io/planb-network/blms-web:${IMAGE_TAG}
    labels:
      - traefik.enable=true
      - traefik.http.routers.university-web-${ENV}.rule=Host(`${DOMAIN_ACADEMY}`)
      - traefik.http.routers.university-web-${ENV}.entrypoints=https
      - traefik.http.routers.university-web-${ENV}.tls=true
      - traefik.http.routers.university-web-${ENV}.middlewares=university-web-${ENV}-compress
      - traefik.http.middlewares.university-web-${ENV}-compress.compress=true
    volumes:
      - ./well-known:/usr/share/nginx/html/.well-known:ro

  network:
    <<: *defaults
    image: ghcr.io/planb-network/blms-network:${IMAGE_TAG}
    labels:
      - traefik.enable=true
      - traefik.http.routers.university-network-${ENV}.rule=Host(`${DOMAIN_NETWORK}`)
      - traefik.http.routers.university-network-${ENV}.entrypoints=https
      - traefik.http.routers.university-network-${ENV}.tls=true
      - traefik.http.routers.university-network-${ENV}.middlewares=university-web-${ENV}-compress
      - traefik.http.middlewares.university-network-${ENV}-compress.compress=true

  contribute:
    <<: *defaults
    image: ghcr.io/planb-network/blms-contribute:${IMAGE_TAG}
    labels:
      - traefik.enable=true
      - traefik.http.routers.university-contribute-${ENV}.rule=Host(`contribute.${DOMAIN_ACADEMY}`)
      - traefik.http.routers.university-contribute-${ENV}.entrypoints=https
      - traefik.http.routers.university-contribute-${ENV}.tls=true
      - traefik.http.routers.university-contribute-${ENV}.middlewares=university-web-${ENV}-compress
      - traefik.http.middlewares.university-contribute-${ENV}-compress.compress=true

  design_system:
    <<: *defaults
    image: ghcr.io/planb-network/blms-design-system:${IMAGE_TAG}
    labels:
      - traefik.enable=true
      - traefik.http.routers.university-ds-${ENV}.rule=Host(`ds.${DOMAIN_ACADEMY}`)
      - traefik.http.routers.university-ds-${ENV}.entrypoints=https
      - traefik.http.routers.university-ds-${ENV}.tls=true
      - traefik.http.routers.university-ds-${ENV}.middlewares=university-web-${ENV}-compress
      - traefik.http.middlewares.university-ds-${ENV}-compress.compress=true

  seed:
    image: ghcr.io/max-lt/pears-cdn:v1.0.4
    environment:
      - SEED=/data
      - CORESTORE_PATH=/corestore
      - CORS=https://testnet.planb.network
      - PROXY_URL=https://testnet-cdn.planb.network
    volumes:
      - ./data/corestore:/corestore
      - ./data/cdn:/data

  # https://typesense.org
  typesense:
    image: typesense/typesense:28.0
    # container_name: typesense
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz}
      - TYPESENSE_DATA_DIR=/usr/share/typesense/data
    volumes:
      - ./data/typesense:/usr/share/typesense/data

  pear_sync:
    <<: *defaults
    image: ghcr.io/planb-network/blms-pear-sync:${IMAGE_TAG}
    volumes:
      - ./data/pear-sync-data:/pear-sync-data
    environment:
      <<: *environment
      POSTGRES_HOST: postgres
      CORESTORE_PATH: /pear-sync-data

  # ONLYOFFICE Document Server for rich PPTX editing
  onlyoffice:
    <<: *defaults
    image: onlyoffice/documentserver:9.0
    environment:
      - ONLYOFFICE_HTTPS_HSTS_ENABLED=false
      - ONLYOFFICE_HTTPS_HSTS_MAXAGE=31536000
      - JWT_ENABLED=false
      - JWT_SECRET=
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      - WOPI_ENABLED=false
      - USE_UNAUTHORIZED_STORAGE=true
      - ONLYOFFICE_DEFAULT_FORMATS=docx;xlsx;pptx
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_HTTP_REQUEST_TO_EDIT_DOCUMENT=true
      - ALLOW_META_IP_ADDRESS=true
      - DENY_EMBEDDED_FONTS=false
      - ONLYOFFICE_TIMEOUT_DOWNLOAD=120000
      - ONLYOFFICE_MAX_PROCESSES=10
      - ONLYOFFICE_TIMEOUT_CONVERSION=120000
      - ONLYOFFICE_MAX_FILE_SIZE=104857600
      - ONLYOFFICE_MAX_TEMPLATE_SIZE=104857600
    labels:
      - traefik.enable=true
      - traefik.http.routers.university-onlyoffice-${ENV}.rule=Host(`onlyoffice.${DOMAIN_ACADEMY}`)
      - traefik.http.routers.university-onlyoffice-${ENV}.entrypoints=https
      - traefik.http.routers.university-onlyoffice-${ENV}.tls=true
      - traefik.http.routers.university-onlyoffice-${ENV}.middlewares=university-web-${ENV}-compress
      - traefik.http.middlewares.university-onlyoffice-${ENV}-compress.compress=true
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'nc', '-zv', 'localhost', '80']

networks:
  default:
    name: ${DOCKER_NETWORK}
    external: true
