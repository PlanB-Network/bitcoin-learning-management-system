name: CI/CD

on:
  push:
    branches:
      - ci-refactoring
      - mainnet
      - testnet
      - dev
  pull_request:

jobs:
  build_base:
    name: Build & Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'weblate-tr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for base
        uses: docker/build-push-action@v6
        with:
          push: ${{ (github.event_name == 'push') && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet') }}
          file: ./docker/Dockerfile.base
          context: .
          tags: ghcr.io/planb-network/blms-base:${{ github.sha }}
          cache-from: type=gha,scope=global
          cache-to: type=gha,mode=max,scope=global

  build_api:
    name: Build API
    if: (github.event_name == 'push') && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet')
    runs-on: ubuntu-latest
    needs: build_base
    env:
      image: ghcr.io/planb-network/blms-api
      base: ghcr.io/planb-network/blms-base:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.image }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Docker image for api
        uses: docker/build-push-action@v6
        with:
          push: ${{ (github.event_name == 'push') && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet') }}
          file: ./apps/api/docker/Dockerfile
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=global
          cache-to: type=gha,mode=max,scope=global
          build-args:
            BASE_IMAGE=${{ env.base }}

  build_web:
    name: Build Web
    if: (github.event_name == 'push') && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet')
    runs-on: ubuntu-latest
    needs: build_base
    env:
      image: ghcr.io/planb-network/blms-web
      base: ghcr.io/planb-network/blms-base:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image metadata for web
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.image }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Docker image for web
        uses: docker/build-push-action@v6
        with:
          push: ${{ (github.event_name == 'push') && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet') }}
          file: ./apps/web/docker/Dockerfile
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=global
          cache-to: type=gha,mode=max,scope=global
          build-args:
            BASE_IMAGE=${{ env.base }}

  build_contribute:
    name: Build contribute
    if: (github.event_name == 'push') && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet')
    runs-on: ubuntu-latest
    needs: build_base
    env:
      image: ghcr.io/planb-network/blms-contribute
      base: ghcr.io/planb-network/blms-base:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image metadata for contribute
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.image }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Docker image for contribute
        uses: docker/build-push-action@v6
        with:
          push: ${{ (github.event_name == 'push') && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet') }}
          file: ./apps/contribute/docker/Dockerfile
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=global
          cache-to: type=gha,mode=max,scope=global
          build-args:
            BASE_IMAGE=${{ env.base }}

  deploy:
    name: Deploy hook
    if: (github.event_name == 'push') && (github.ref == 'refs/heads/mainnet' || github.ref == 'refs/heads/testnet')
    runs-on: ubuntu-latest
    needs:
      - build_api
      - build_web
    steps:
      - name: Invoke deployment hook
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ github.ref == 'refs/heads/mainnet' && secrets.MAINNET_WEBHOOK_URL || secrets.TESTNET_WEBHOOK_URL }}
          webhook_secret: ${{ github.ref == 'refs/heads/mainnet' && secrets.MAINNET_WEBHOOK_SECRET || secrets.TESTNET_WEBHOOK_SECRET }}
